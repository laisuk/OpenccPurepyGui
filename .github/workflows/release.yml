name: Release OpenccPurepyGui

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
            archive_name: OpenccPurepyGui-${{ github.ref_name }}-linux-x64.tar.gz

          - os: windows-latest
            artifact_suffix: win-x64
            archive_name: OpenccPurepyGui-${{ github.ref_name }}-win-x64.zip
            msi_name: OpenccPurepyGui-${{ github.ref_name }}-win-x64-setup.msi

          - os: macos-15-intel
            artifact_suffix: macos-x64
            archive_name: OpenccPurepyGui-${{ github.ref_name }}-macos-x64.zip
            pdfium_plat: macos-x64

          - os: macos-latest
            artifact_suffix: macos-arm64
            archive_name: OpenccPurepyGui-${{ github.ref_name }}-macos-arm64.zip
            pdfium_plat: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          VERSION=$(grep -vE '^[[:space:]]*(#|$)' VERSION | head -n 1 | xargs)
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "VERSION=$VERSION"
          echo "TAG_VERSION=$TAG_VERSION"

          if [ -z "$VERSION" ]; then
            echo "VERSION file does not contain a valid version."
            exit 1
          fi

          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag '$GITHUB_REF_NAME' does not match VERSION '$VERSION'."
            exit 1
          fi

      - name: Set up Python
        if: matrix.os != 'macos-15-intel'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libgl1 libx11-xcb1 libxkbcommon-x11-0 libxcb-cursor0 libnss3

      - name: Show tool versions
        shell: bash
        run: |
          python --version
          python -m nuitka --version || true
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            patchelf --version || true
          else
            echo "Skipping patchelf check (not Linux)."
          fi

      # ---------- Build per OS so we can pass the right flags ----------
      - name: Build (Linux, Nuitka)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PDFIUM_PLAT: linux-x64
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --include-package=opencc_purepy \
            --include-package=helpers \
            --include-package=openxml_module \
            --include-package=pdf_module \
            --include-package=services \
            --include-package=widgets \
            --include-package=workers \
            --include-data-dir=opencc_purepy/dicts=opencc_purepy/dicts \
            --include-data-files=VERSION=VERSION \
            --include-raw-dir=pdf_module/pdfium/${PDFIUM_PLAT}=pdf_module/pdfium/${PDFIUM_PLAT} \
            --output-filename=OpenccPurepyGui \
            --lto=yes \
            --assume-yes-for-downloads \
            mainwindow.py

      - name: Build (Windows, Nuitka + optional icon + no console)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iconFlag = ""
          if (Test-Path "resource/openccpurepygui.ico") {
            $iconFlag = "--windows-icon-from-ico=resource/openccpurepygui.ico"
          }

          $pdfiumFlag = ""
          if (Test-Path "pdf_module/pdfium/win-x64/pdfium.dll") {
            $pdfiumFlag = "--include-raw-dir=pdf_module/pdfium/win-x64=pdf_module/pdfium/win-x64"
          }

          python -m nuitka `
            --standalone `
            --enable-plugin=pyside6 `
            --include-package=opencc_purepy `
            --include-package=helpers `
            --include-package=openxml_module `
            --include-package=pdf_module `
            --include-package=services `
            --include-package=widgets `
            --include-package=workers `
            --include-data-dir=opencc_purepy/dicts=opencc_purepy/dicts `
            --include-data-files=VERSION=VERSION `
            --output-filename=OpenccPurepyGui `
            --windows-console-mode=disable `
            --lto=yes `
            --assume-yes-for-downloads `
            $pdfiumFlag `
            $iconFlag `
            mainwindow.py      

      - name: Build MSI (Windows, WiX 3.14)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSI_NAME: ${{ matrix.msi_name }}
        run: |
          $ErrorActionPreference = "Stop"

          # Portable WiX 3.14 binaries: no installer and no .NET WiX dependency.
          $wixRoot = Join-Path $env:RUNNER_TEMP "wix314"
          $wixZip  = Join-Path $env:RUNNER_TEMP "wix314-binaries.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/wixtoolset/wix3/releases/download/wix314rtm/wix314-binaries.zip" `
            -OutFile $wixZip

          Expand-Archive `
            -Path $wixZip `
            -DestinationPath $wixRoot `
            -Force

          foreach ($tool in @("heat.exe", "candle.exe", "light.exe")) {
            $toolPath = Join-Path $wixRoot $tool
            if (-not (Test-Path $toolPath)) {
              throw "Missing WiX tool: $toolPath"
            }
          }

          # build-msi.ps1 is the MSI build SSOT used locally and in CI.
          $env:PATH = "$wixRoot;$env:PATH"

          .\scripts\build-msi.ps1 `
            -MsiName $env:MSI_NAME `
            -OutputDir "."

      - name: macOS Intel prerequisites (OpenSSL@3)
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          # 1. Force Homebrew to link OpenSSL so the dylibs exist in /usr/local/opt.
          # This ensures Nuitka's dependency scanner can physically find the files.
          brew link --force openssl@3

          # 2. Inject search paths into GITHUB_ENV for Nuitka's internal compiler (Scons).
          # Without these, Nuitka fails to resolve '_hashlib' dependencies on Intel 
          # because macOS 15 system paths are restricted (SIP). Scons 'inherits' 
          # these flags to correctly link OpenSSL during the final build stage.
          echo "LDFLAGS=-L/usr/local/opt/openssl@3/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/usr/local/opt/openssl@3/include" >> $GITHUB_ENV

      - name: Build (macOS, Nuitka + app icon)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ICON_FLAG=""
          if [ -f "resource/openccpurepygui.icns" ]; then
            ICON_FLAG="--macos-app-icon=resource/openccpurepygui.icns"
          fi

          PDFIUM_PLAT="${{ matrix.pdfium_plat }}"

          PDFIUM_FLAG=""
          if [ -d "pdf_module/pdfium/$PDFIUM_PLAT" ]; then
            PDFIUM_FLAG="--include-raw-dir=pdf_module/pdfium/$PDFIUM_PLAT=pdf_module/pdfium/$PDFIUM_PLAT"
          else
            echo "PDFium folder missing: pdf_module/pdfium/$PDFIUM_PLAT"
          fi

          python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --include-package=opencc_purepy \
            --include-package=helpers \
            --include-package=openxml_module \
            --include-package=pdf_module \
            --include-package=services \
            --include-package=widgets \
            --include-package=workers \
            --include-data-dir=opencc_purepy/dicts=opencc_purepy/dicts \
            --include-data-files=VERSION=VERSION \
            --output-filename=OpenccPurepyGui \
            --lto=yes \
            --assume-yes-for-downloads \
            ${PDFIUM_FLAG} \
            ${ICON_FLAG} \
            mainwindow.py

      # ---------- Package artifacts ----------
      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          archive_name: ${{ matrix.archive_name }}
        run: |
          tar -czf "$archive_name" -C mainwindow.dist .

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          archive_name: ${{ matrix.archive_name }}
        run: |
          Compress-Archive -Path mainwindow.dist\* -DestinationPath $env:archive_name

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          archive_name: ${{ matrix.archive_name }}
        run: |
          cd mainwindow.dist
          zip -r "../$archive_name" .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenccPurepyGui-${{ github.ref_name }}-${{ matrix.artifact_suffix }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

      - name: Upload artifact (MSI)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: OpenccPurepyGui-${{ github.ref_name }}-win-x64-msi
          path: ${{ matrix.msi_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: List files
        run: |
          echo "Artifacts downloaded to ./dist"
          find dist -type f -maxdepth 2

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist/**/*
